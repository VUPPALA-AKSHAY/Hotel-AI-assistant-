<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="vArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="26" font-weight="700" fill="#0f172a">Voice Agent Flow</text>
  <text x="40" y="68" font-size="15" fill="#64748b">Two paths from the same chat UI: read any reply aloud, or start a phone-style call</text>

  <!-- Source -->
  <rect x="470" y="120" width="260" height="60" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="147" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">Chat UI (:3001)</text>
  <text x="600" y="167" font-size="12.5" fill="#475569" text-anchor="middle">rendered reply · speak icon · call icon</text>

  <!-- Branch labels -->
  <line x1="600" y1="180" x2="600" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="230" x2="600" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="900" y1="230" x2="600" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="230" x2="300" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#vArrow)"/>
  <line x1="900" y1="230" x2="900" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#vArrow)"/>

  <!-- Left path: TTS -->
  <rect x="90" y="286" width="420" height="60" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="300" y="312" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">Read aloud (text-to-speech)</text>
  <text x="300" y="332" font-size="12.5" fill="#475569" text-anchor="middle">click the speak icon on any reply</text>

  <line x1="300" y1="346" x2="300" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#vArrow)"/>

  <rect x="90" y="402" width="420" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="428" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">POST /api/voice/synthesize</text>
  <text x="300" y="448" font-size="12.5" fill="#475569" text-anchor="middle">{ "text": "..." } → Express proxy (voice id injected server-side)</text>

  <line x1="300" y1="462" x2="300" y2="508" stroke="#64748b" stroke-width="2" marker-end="url(#vArrow)"/>

  <rect x="90" y="518" width="420" height="60" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="544" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">ElevenLabs multilingual TTS</text>
  <text x="300" y="564" font-size="12.5" fill="#475569" text-anchor="middle">mp3 audio streams back to your browser</text>

  <!-- Right path: Vapi call -->
  <rect x="690" y="286" width="420" height="60" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="900" y="312" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">Start a call (voice agent)</text>
  <text x="900" y="332" font-size="12.5" fill="#475569" text-anchor="middle">click the call icon to open the call modal</text>

  <line x1="900" y1="346" x2="900" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#vArrow)"/>

  <rect x="690" y="402" width="420" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="428" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Vapi Web SDK</text>
  <text x="900" y="448" font-size="12.5" fill="#475569" text-anchor="middle">in-browser phone-style widget, no extra app</text>

  <line x1="900" y1="462" x2="900" y2="508" stroke="#64748b" stroke-width="2" marker-end="url(#vArrow)"/>

  <rect x="690" y="518" width="420" height="60" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="900" y="544" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">Vapi assistant (Mira)</text>
  <text x="900" y="564" font-size="12.5" fill="#475569" text-anchor="middle">same system prompt + knowledge base + confidentiality</text>
</svg>